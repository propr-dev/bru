name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true

# Creating a release and uploading assets needs write access to contents.
permissions:
  contents: write

env:
  PROJECT: ClickyWindows.csproj
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Resolve tag
        id: tag
        shell: pwsh
        run: |
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { "${{ github.ref_name }}" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing $tag"
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}

      - name: Publish self-contained executable
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          # Ship the executable alongside the files a first-time user needs.
          Copy-Item publish/ClickyWindows.exe dist/
          Copy-Item settings.example.json      dist/
          Copy-Item README.md                  dist/
          Copy-Item LICENSE                    dist/
          Compress-Archive -Path dist/* -DestinationPath "Bru-$tag-win-x64.zip" -Force
          Get-Item "Bru-$tag-win-x64.zip" | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          gh release create $tag "Bru-$tag-win-x64.zip" `
            --title "Bru $tag" `
            --generate-notes `
            --verify-tag
