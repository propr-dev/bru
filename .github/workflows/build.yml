name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT: ClickyWindows.csproj
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build (Release, win-x64)
    # WPF + WinForms + the Windows 10 SDK target framework require a Windows runner.
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }}

      - name: Build
        # The codebase builds warning-free. Keep it that way.
        run: dotnet build ${{ env.PROJECT }} -c Release --no-restore -warnaserror

      - name: Verify single-file publish
        # The README promises one self-contained .exe — prove it still produces one
        # on every change, rather than discovering it is broken at release time.
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Confirm the executable exists
        shell: pwsh
        run: |
          $exe = "publish/ClickyWindows.exe"
          if (-not (Test-Path $exe)) { throw "Expected $exe to be produced by publish" }
          $sizeMb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "ClickyWindows.exe built successfully ($sizeMb MB)"
